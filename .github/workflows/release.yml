name: Release
run-name: Release ${{ github.ref_type == 'tag' && github.ref_name || 'from main' }}

# Two ways in:
#   1. push to main  - read the version from package.json and publish it if that tag does not exist yet
#   2. push a v* tag - publish the version carried by the tag
# Both run the full test matrix first; a failing matrix blocks the release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Only one release at a time, so a main push and a tag push cannot race
# into creating the same release twice.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: v
        name: Read version and decide whether to publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            PKG_V=$(node -p "require('./package.json').version")
            if [ "$VERSION" != "$PKG_V" ]; then
              echo "::error::tag is $TAG but package.json says $PKG_V; align them before releasing"
              exit 1
            fi
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released, skipping"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will release $TAG"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Package and publish
    needs: [prepare, test]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # creating the tag and the release needs write access
    steps:
      - uses: actions/checkout@v4

      - name: Build runtime archives
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          DIR="cc-rpm-gate-$VERSION"
          # Ship only what is needed to run: both implementations, the config,
          # the launchers and the pi extension. Tests and CI config stay out.
          mkdir -p "dist/$DIR/python"
          cp -r src "dist/$DIR/src"
          cp -r python/gate "dist/$DIR/python/gate"
          cp -r pi "dist/$DIR/pi"
          cp gate.config.json gate-settings.json package.json LICENSE "dist/$DIR"/
          cp README.md README.zh-CN.md "dist/$DIR"/
          cp ./*.bat "dist/$DIR"/
          find "dist/$DIR" -name '__pycache__' -type d -prune -exec rm -rf {} +
          find "dist/$DIR" -name '*.pyc' -delete

          # .gitattributes checks .bat files out as CRLF; confirm the archive really has them.
          # Compare byte counts instead of using grep: grep's CR detection differs between builds.
          for f in "dist/$DIR"/*.bat; do
            lines=$(wc -l < "$f")
            crs=$(tr -dc '\r' < "$f" | wc -c)
            if [ "$lines" -ne "$crs" ]; then
              echo "::error::$f is not fully CRLF ($lines lines, $crs CRs); it would misbehave on Windows"
              exit 1
            fi
          done

          cd dist
          zip -qr "$DIR.zip" "$DIR"
          tar -czf "$DIR.tar.gz" "$DIR"
          sha256sum "$DIR.zip" "$DIR.tar.gz" > SHA256SUMS.txt
          ls -la

      - name: Write release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "Local request gate for Claude Code and pi: one shared rate limit across every window, with automatic 429 stash-and-retry."
            echo
            echo "### Downloads"
            echo
            echo "| File | Contents |"
            echo "| --- | --- |"
            echo "| \`cc-rpm-gate-$VERSION.zip\` | Node + Python implementations, config, launchers, pi extension |"
            echo "| \`cc-rpm-gate-$VERSION.tar.gz\` | Same contents, tar.gz |"
            echo "| \`SHA256SUMS.txt\` | Checksums for both archives |"
            echo
            echo "Verify before unpacking:"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS.txt"
            echo '```'
            echo
            echo "### Requirements"
            echo
            echo "Node 18+ for the Node implementation, Python 3.8+ for the Python one. No third-party dependencies either way."
            echo
            echo "Docs: [English](https://github.com/More678/CC-Rpm-Gate/blob/main/README.md) | [简体中文](https://github.com/More678/CC-Rpm-Gate/blob/main/README.zh-CN.md)"
          } > notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # Creates the tag on the current commit when it does not exist yet
          # (the push-to-main and workflow_dispatch paths).
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --notes-file notes.md \
            "dist/cc-rpm-gate-$VERSION.zip" \
            "dist/cc-rpm-gate-$VERSION.tar.gz" \
            "dist/SHA256SUMS.txt"
          echo "Published: https://github.com/${{ github.repository }}/releases/tag/$TAG"
